name: Repo & Unity Guardrails

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Static Meta, GUID, Asmdef & Code Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository (metadata & text only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Unity .meta pairing, GUID uniqueness, Asmdef DAG & C# rules
        run: python3 tools/ci/verify_guardrails.py

      - name: Validate PR commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x .githooks/commit-msg
          tmp_msg="$(mktemp)"
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$sha" > "$tmp_msg"
            echo "Checking commit $sha: $(head -n 1 "$tmp_msg")"
            ./.githooks/commit-msg "$tmp_msg"
          done
          rm -f "$tmp_msg"
