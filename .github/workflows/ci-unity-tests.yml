name: Unity Test Suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Check Unity CI Credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect Unity secrets
        id: check
        env:
          HAS_SA_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID != '' }}
          HAS_SA_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL != '' }}
          HAS_ULF: ${{ secrets.UNITY_LICENSE_FILE_BASE64 != '' }}
        run: |
          if [ "$HAS_SA_ID" = "true" ] && [ "$HAS_SA_SECRET" = "true" ] && { [ "$HAS_SERIAL" = "true" ] || [ "$HAS_ULF" = "true" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Unity Cloud Runner Skipped (Credentials Not Configured Yet)"
              echo ""
              echo "Static `.meta`, GUID, YAML, `.asmdef` DAG, and C# standards checks still run in **Repo & Unity Guardrails**."
              echo "To enable automated cloud NUnit execution (`EditMode` + `PlayMode`) on Unity `6000.6.9f1`, add repository secrets under **Settings → Secrets and variables → Actions**:"
              echo "- `UNITY_SERVICE_ACCOUNT_ID` & `UNITY_SERVICE_ACCOUNT_SECRET` (Unity Cloud → Administration → Service Accounts)"
              echo "- `UNITY_LICENSE_SERIAL` **or** `UNITY_LICENSE_FILE_BASE64` (base64-encoded `.ulf` license file)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    name: EditMode & PlayMode Tests (Unity 6000.6.9f1)
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      UNITY_FORMAT: github
      UNITY_NON_INTERACTIVE: '1'

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Mask credentials in logs
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
        run: |
          [ -n "$UNITY_SERVICE_ACCOUNT_ID" ] && echo "::add-mask::$UNITY_SERVICE_ACCOUNT_ID" || true
          [ -n "$UNITY_SERVICE_ACCOUNT_SECRET" ] && echo "::add-mask::$UNITY_SERVICE_ACCOUNT_SECRET" || true
          [ -n "$UNITY_LICENSE_SERIAL" ] && echo "::add-mask::$UNITY_LICENSE_SERIAL" || true

      - name: Install Unity CLI
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Unity Editor installer cache
        uses: actions/cache@v4
        with:
          path: ~/.config/unityhub/downloads
          key: unity-downloads-6000.6.9f1

      - name: Compute Library cache key
        id: cache-key
        run: echo "key=$(unity cache key)" >> "$GITHUB_OUTPUT"

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: ./Library
          key: unity-library-tests-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            unity-library-tests-

      - name: Install Ubuntu runtime dependencies for Unity 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgtk-3-0t64 libnss3 \
            libasound2t64 libgbm1 libdrm2 libxtst6 \
            libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
            libxfixes3 libxi6 libxrender1 libxext6 \
            libsm6 libice6 libxkbcommon0 libpango-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libnotify4 \
            libsecret-1-0 xvfb

      - name: Install Unity 6000.6.9f1
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
        run: unity install 6000.6.9f1 --yes --accept-eula

      - name: Activate Unity license
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
          UNITY_LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: |
          if [ -n "$UNITY_LICENSE_FILE_BASE64" ]; then
            printf '%s' "$UNITY_LICENSE_FILE_BASE64" | base64 -d > /tmp/unity.ulf
            unity license activate --file /tmp/unity.ulf
            rm -f /tmp/unity.ulf
          else
            unity license activate
          fi

      - name: Run Unity CI preflight
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
        run: unity doctor --ci

      - name: Run EditMode tests
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
        run: unity test . --mode EditMode --report-format nunit,junit --output TestResults-EditMode.xml --timeout 600 -- -nographics

      - name: Run PlayMode tests
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
        run: xvfb-run --auto-servernum unity test . --mode PlayMode --report-format nunit,junit --output TestResults-PlayMode.xml --timeout 900

      - name: Upload NUnit & JUnit test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-${{ github.sha }}
          path: |
            TestResults-*.xml
          if-no-files-found: warn

      - name: Return Unity license
        if: always()
        env:
          UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
          UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
        run: unity license return --yes || true
